# auth-service — JWT 발급 + JWKS 공개.
# 서명키가 파드 메모리에만 있으므로 replicas 는 반드시 1 (늘리려면 키 공유/회전 설계 필요).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/kimsukhwan/msa-k3s-lab-auth-service:4acc5f9444510e80de9440835c754c6e707788e3
          imagePullPolicy: Always
          ports:
            - containerPort: 8094
          readinessProbe:
            httpGet:
              path: /health
              port: 8094
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8094
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8094
      targetPort: 8094
