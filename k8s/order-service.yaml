apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/kimsukhwan/msa-k3s-lab-order-service:24656ec02df6f9f02d0ef94a5d3d05856475d434
          imagePullPolicy: Always
          ports:
            - containerPort: 8092
          env:
            # product-service를 IP가 아니라 k8s Service 이름으로 찾는다 — CoreDNS가 자동 변환한다.
            - name: PRODUCT_SERVICE_BASE_URL
              value: "http://product-service:8091"
          readinessProbe:
            httpGet:
              path: /orders/health
              port: 8092
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /orders/health
              port: 8092
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 8092
      targetPort: 8092
