apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/kimsukhwan/msa-k3s-lab-gateway:9bb7bc4426808084b854db9b01ed1057904788fa
          imagePullPolicy: Always
          ports:
            - containerPort: 8093 # 평문 HTTP — k8s 헬스체크 전용(PlainPortRestrictionFilter가 업무 경로는 막는다)
            - containerPort: 8446 # mTLS — 실제 업무 트래픽은 전부 이 포트로만 들어온다
          env:
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8092"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8091"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8094"
            - name: AUTH_JWKS_URL
              value: "http://auth-service:8094/.well-known/jwks.json"
            - name: REDIS_HOST
              value: redis
            - name: MTLS_ENABLED
              value: "true"
            - name: MTLS_PORT
              value: "8446"
            - name: MTLS_KEYSTORE_PATH
              value: /etc/mtls/keystore.p12
            - name: MTLS_TRUSTSTORE_PATH
              value: /etc/mtls/truststore.p12
            - name: MTLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-mtls
                  key: password
            - name: MTLS_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-mtls
                  key: password
          volumeMounts:
            - name: mtls-certs
              mountPath: /etc/mtls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8093
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8093
            initialDelaySeconds: 15
      volumes:
        - name: mtls-certs
          secret:
            secretName: gateway-mtls
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: plain-health
      port: 8093
      targetPort: 8093
    - name: mtls
      port: 8446
      targetPort: 8446
---
# k3s에 기본 내장된 Traefik(Ingress Controller)이 이 규칙을 자동으로 잡는다.
# 백엔드가 gateway 가 아니라 superapp-proxy 인 것에 주의 — 외부(React)는 슈퍼앱 백엔드
# 대역까지만 도달하고, 거기서 은행 gateway 로는 mTLS(k8s Service 밖, superapp-proxy.yaml
# 참고)로만 넘어간다. gateway 자신은 이제 클러스터 밖에서 직접 부를 수 없다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superapp-proxy
                port:
                  number: 8095
