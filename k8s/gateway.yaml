apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/kimsukhwan/msa-k3s-lab-gateway:e6321f24ce87eb6fa5c23585e709c61c010c8c57
          imagePullPolicy: Always
          ports:
            - containerPort: 8093
          env:
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8092"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8091"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8094"
            - name: AUTH_JWKS_URL
              value: "http://auth-service:8094/.well-known/jwks.json"
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8093
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8093
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8093
      targetPort: 8093
---
# k3s에 기본 내장된 Traefik(Ingress Controller)이 이 규칙을 자동으로 잡는다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8093
