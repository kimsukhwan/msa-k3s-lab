name: CI - build, test, push images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle build (compile + test, all 3 services)
        run: ./gradlew build --no-daemon

  build-and-push-images:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, order-service, product-service, auth-service]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN은 Actions가 매 실행마다 자동 발급 — 개인 비밀번호/PAT을 쓰지 않는다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          # GitHub 러너는 amd64인데 로컬 k3d(Apple Silicon)는 arm64라 플랫폼이 안 맞으면
          # ImagePullBackOff("no match for platform in manifest")가 난다 — 멀티아키텍처로 빌드한다.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-${{ matrix.service }}:${{ github.sha }}

  # ArgoCD는 git의 상태만 본다 — 이미지가 ghcr에 새로 올라간 것만으로는 아무 일도 안 일어난다.
  # 그래서 k8s/*.yaml에 적힌 이미지 태그를 이 커밋 SHA로 갱신해 git에 반영해야
  # ArgoCD가 "spec이 바뀌었다"고 판단해 자동 동기화한다 (next.msa의 bump-image-tag와 동일한 패턴).
  bump-manifests:
    needs: build-and-push-images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump image tags to this commit SHA
        run: |
          sed -i "s#ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-gateway:.*#ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-gateway:${{ github.sha }}#" k8s/gateway.yaml
          sed -i "s#ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-order-service:.*#ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-order-service:${{ github.sha }}#" k8s/order-service.yaml
          sed -i "s#ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-product-service:.*#ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-product-service:${{ github.sha }}#" k8s/product-service.yaml
          sed -i "s#ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-auth-service:.*#ghcr.io/${{ github.repository_owner }}/msa-k3s-lab-auth-service:${{ github.sha }}#" k8s/auth-service.yaml

      - name: Commit and push (skip CI to avoid a bump loop)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/*.yaml
          git diff --cached --quiet && echo "no image tag changes" || git commit -m "chore(deploy): bump image tags to ${{ github.sha }} [skip ci]"
          git push
